name: Verify Repro
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - run: npm ci
      - run: npm run browsers -- --with-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:dsh
        env:
          DSH_E2E_LOG: dsh-e2e.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-transcript
          path: dsh-e2e.log
          if-no-files-found: ignore
